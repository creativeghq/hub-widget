name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (creates tag v<version>)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Ad-hoc signature ("-"): no Apple Developer account. Universal so it runs on Apple silicon and Intel.
      - name: Build (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project HubWidget.xcodeproj -scheme HubWidget -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION=${{ steps.v.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -3

      - name: Verify the bundle
        run: |
          APP="build/Build/Products/Release/Hub Widget.app"
          test -d "$APP/Contents/PlugIns/HubWidgetExtension.appex"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP/Contents/PlugIns/HubWidgetExtension.appex"
          for b in "$APP" "$APP/Contents/PlugIns/HubWidgetExtension.appex"; do
            if codesign -d --entitlements - "$b" 2>&1 | grep -q get-task-allow; then echo "debug entitlement in $b"; exit 1; fi
          done
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -archs "$APP/Contents/MacOS/Hub Widget"
          # Sparkle decides "is there an update" from CFBundleVersion: a stale number re-offers the same update forever.
          for plist in "$APP/Contents/Info.plist" "$APP/Contents/PlugIns/HubWidgetExtension.appex/Contents/Info.plist"; do
            SV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")
            BV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")
            echo "$plist: $SV ($BV)"
            test "$SV" = "${{ steps.v.outputs.version }}" && test "$BV" = "${{ github.run_number }}" || { echo 'version mismatch'; exit 1; }
          done

      - name: Package .dmg and .zip
        run: |
          V=${{ steps.v.outputs.version }}
          APP="build/Build/Products/Release/Hub Widget.app"
          mkdir -p dist stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          cp scripts/INSTALL.txt "stage/How to install.txt"
          hdiutil create -volname "Hub Widget $V" -srcfolder stage -ov -format UDZO "dist/HubWidget-$V.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/HubWidget-$V.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Sparkle auto-update feed. The app reads releases/latest/download/appcast.xml, so publishing a
      # release IS shipping the update. The .zip is signed with the EdDSA key whose public half is in
      # the app (SUPublicEDKey); an unsigned or mis-signed update is refused by every installed copy.
      - name: Sign the update and write appcast.xml
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "SPARKLE_ED_PRIVATE_KEY secret is missing"; exit 1; }
          python3 -m pip install --quiet --break-system-packages cryptography 2>/dev/null || python3 -m pip install --quiet cryptography
          V=${{ steps.v.outputs.version }} BUILD=${{ github.run_number }} python3 scripts/make_appcast.py
          cat dist/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          TAG="v$V"
          NOTES=$(cat scripts/RELEASE_NOTES.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Hub Widget $V" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
