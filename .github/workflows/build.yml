name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build app + widget (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HubWidget.xcodeproj -scheme HubWidget -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project HubWidget.xcodeproj -scheme HubWidget -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            -only-testing:HubWidgetTests test | tee test.log | grep -E "error:|Test Case|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
