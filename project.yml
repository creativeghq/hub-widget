name: HubWidget
options:
  bundleIdPrefix: com.creativeghq
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  HubWidget:
    type: application
    platform: macOS
    sources: [HubWidget, Shared]
    dependencies:
      - target: HubWidgetExtension
      - package: Sparkle
    info:
      path: HubWidget/Info.plist
      properties:
        CFBundleDisplayName: Hub Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        LSUIElement: true
        NSUserNotificationAlertStyle: alert
        SUFeedURL: https://github.com/creativeghq/hub-widget/releases/latest/download/appcast.xml
        SUPublicEDKey: MkOQFKrb7oh3ILwOWQHlCdXjhiAk1SktIkKd+NRLv2M=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
        CFBundleURLTypes:
          - CFBundleURLName: com.creativeghq.hubwidget
            CFBundleURLSchemes: [hubwidget]
    entitlements:
      path: HubWidget/HubWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/HubWidget/
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_NAME: Hub Widget
        PRODUCT_BUNDLE_IDENTIFIER: com.creativeghq.hubwidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HubWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [HubWidgetExtension, Shared]
    info:
      path: HubWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Hub Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HubWidgetExtension/HubWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/HubWidget/
    settings:
      base:
        PRODUCT_NAME: HubWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.creativeghq.hubwidget.widget
        SKIP_INSTALL: YES

  HubWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creativeghq.hubwidget.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HubWidget:
    build:
      targets:
        HubWidget: all
        HubWidgetExtension: all
    run:
      config: Debug
    test:
      targets: [HubWidgetTests]
    archive:
      config: Release
  HubWidgetExtension:
    build:
      targets:
        HubWidget: all
        HubWidgetExtension: all
    run:
      config: Debug
